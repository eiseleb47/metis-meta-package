name: CI (linux + macos)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - macos-14      # Apple Silicon, macOS 14 Sonoma
          - macos-15      # Apple Silicon, macOS 15 Sequoia
          
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run bootstrap script
        run: |
          chmod +x ./bootstrap.sh
          printf "y\ny\n2\n\n" | ./bootstrap.sh




name: Minimal CI (linux + macos)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run bootstrap script
        run: |
          chmod +x ./bootstrap.sh
          printf '\n' | ./bootstrap.sh

      - name: Run meta-package script
        # adjust or remove if this file is not always present
        run: |
          if [ -f ./metis.sh ]; then
            chmod +x ./metis.sh
            ./metis.sh
          fi

